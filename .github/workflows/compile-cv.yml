name: Compile LaTeX CV
on: [push]

# Allow the workflow to publish the compiled PDF back to the repository.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          compiler: xelatex
          working_directory: asset/cv/

      - name: Prepare and validate the single-page PDF
        run: |
          set -euo pipefail
          mv asset/cv/main.pdf asset/cv/cv_mattia_fait.pdf
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python3 -m unittest discover -s tests -p 'test_cv.py' -v

      - name: Upload PDF to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: formal cv auto-update [skip ci]"
          file_pattern: 'asset/cv/cv_mattia_fait.pdf'
