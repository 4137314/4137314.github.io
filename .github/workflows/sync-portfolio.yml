name: Sync portfolio from project metadata

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Check out portfolio metadata
        uses: actions/checkout@v4
        with:
          repository: 4137314/portfolio
          path: portfolio-source
      - name: Render project index
        run: python3 portfolio-source/scripts/generate_site.py --readme portfolio-source/README.md --site portfolio/index.html
      - name: Commit updated index
        run: |
          if git diff --quiet -- portfolio/index.html; then
            echo "Portfolio index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/index.html
          git commit -m "chore: sync generated project portfolio [skip ci]"
          git push
